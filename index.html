<!DOCTYPE html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>店舗情報</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }

:root{
  --ink:        #211512;
  --ink-soft:   #341E17;
  --red:        #B4271E;
  --red-dark:   #8A1B15;
  --amber:      #E8A33D;
  --amber-soft: #F3C878;
  --bone:       #FBF3E7;
  --bone-dim:   #F1E3CC;
  --ash:        #6E6259;
  --line:       #E7D6B8;
  --maps-green: #1E8E5A;
  --maps-green-dark: #146B45;

  --font-display: 'Shippori Mincho B1', 'Zen Kaku Gothic New', serif;
  --font-body: 'Zen Kaku Gothic New', 'Noto Sans KR', 'Noto Sans TC', 'Noto Sans Thai', -apple-system, sans-serif;

  --lang-bar-h: 46px;
  --cta-h: 84px;
  --radius: 14px;
}

body{
  background: #3A2A20;
  font-family: var(--font-body);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.app-shell{
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  background: var(--bone);
  min-height: 100vh;
  position: relative;
  padding-top: var(--lang-bar-h);
  padding-bottom: calc(var(--cta-h) + 18px);
}
@media (min-width: 481px){
  .app-shell{ box-shadow: 0 0 60px rgba(0,0,0,.45); }
  body{ padding: 24px 0; }
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

.lang-bar{
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: var(--lang-bar-h);
  background: var(--ink);
  display: flex;
  align-items: stretch;
  z-index: 60;
  border-bottom: 1px solid rgba(232,163,61,.35);
}
.lang-bar button{
  flex: 1 1 0;
  background: transparent;
  border: none;
  border-right: 1px solid rgba(255,255,255,.08);
  color: rgba(251,243,231,.55);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .03em;
  cursor: pointer;
  transition: color .15s ease, background .15s ease;
}
.lang-bar button:last-child{ border-right: none; }
.lang-bar button.active{
  color: var(--ink);
  background: var(--amber-soft);
}

.hero{
  position: relative;
  height: 340px;
  overflow: hidden;
  background:
    linear-gradient(160deg, rgba(180,39,30,.35), transparent 55%),
    repeating-linear-gradient(135deg, #3A2A20, #3A2A20 14px, #4a3626 14px, #4a3626 28px);
}
.hero::after{
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(33,21,18,.30) 0%, rgba(33,21,18,.12) 32%, rgba(33,21,18,.95) 100%);
}
.hero-content{
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 20px 20px 22px;
  z-index: 2;
}
.hero-eyebrow{
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--amber-soft);
  font-size: 12px; font-weight: 700; letter-spacing: .08em;
  margin-bottom: 8px;
}
.hero-eyebrow::before{ content:""; width:16px; height:2px; background: var(--amber-soft); display:inline-block; flex: 0 0 auto; }
.hero-kana{
  color: rgba(251,243,231,.65);
  font-size: 11px;
  letter-spacing: .12em;
  margin: 0 0 3px;
}
.hero-title{
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--bone);
  font-size: 30px;
  line-height: 1.3;
  margin: 0 0 6px;
  text-shadow: 0 2px 14px rgba(0,0,0,.5);
}
.hero-sub{ color: rgba(251,243,231,.9); font-size: 13px; font-weight: 700; margin: 0; line-height: 1.6; white-space: pre-line; }
.hero-tag{
  position: absolute; top: 16px; right: 16px; z-index: 2;
  background: var(--red);
  color: var(--bone);
  font-size: 12px; font-weight: 700; letter-spacing: .06em;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid rgba(232,163,61,.6);
  box-shadow: 0 3px 10px rgba(0,0,0,.4);
}
.hero.no-photo{
  height: 210px;
  background: linear-gradient(160deg, rgba(180,39,30,.28), transparent 60%), var(--ink);
}
.hero-badge-24{
  position: absolute; top: 16px; left: 16px; z-index: 2;
  background: var(--amber);
  color: var(--ink);
  font-size: 11.5px; font-weight: 900; letter-spacing: .04em;
  padding: 7px 12px; border-radius: 999px;
  box-shadow: 0 3px 10px rgba(0,0,0,.35);
}

.coupon-wrap{ padding: 16px 16px 0; }
.coupon{
  position: relative; display: flex; align-items: stretch;
  background: var(--ink-soft); border-radius: 10px; overflow: hidden;
  box-shadow: 0 6px 18px rgba(33,21,18,.3);
}
.coupon-stub{
  flex: 0 0 78px; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 10px 6px; background: var(--red); color: var(--bone);
  font-size: 12px; font-weight: 700; line-height: 1.5;
}
.coupon-main{
  flex: 1; position: relative; padding: 14px 16px 14px 22px;
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
}
.coupon-main::before{
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
  border-left: 2px dashed rgba(232,163,61,.45);
}
.coupon::before{
  content: ""; position: absolute; top: 50%; left: 70px; transform: translateY(-50%);
  width: 16px; height: 16px; border-radius: 50%; background: var(--bone); z-index: 2;
}
.coupon-main-text{
  color: var(--bone); font-family: var(--font-display); font-weight: 700;
  font-size: 19px; line-height: 1.3;
}
.coupon-note{ color: rgba(251,243,231,.6); font-size: 11px; margin-top: 2px; }
.coupon-expiry{ color: var(--amber-soft); font-size: 10.5px; margin-top: 3px; font-weight: 700; }

.section{ padding: 26px 16px 0; }
.section-heading{
  font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--ink);
  margin: 0 0 4px; display: flex; align-items: baseline; gap: 8px;
}
.section-heading small{
  font-family: var(--font-body); font-weight: 700; font-size: 11px; color: var(--red); letter-spacing: .08em;
}
.divider{
  height: 1px; margin: 22px 0 0;
  background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
  position: relative;
}
.divider::after{
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
  transform: translate(-50%,-50%); box-shadow: 0 0 6px 1px rgba(232,163,61,.5);
}

.catch-card{
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-top: 14px;
}
.catch-card h3{ font-size: 15.5px; margin: 0 0 8px; font-weight: 700; color: var(--ink); }
.catch-card p{ font-size: 13px; line-height: 1.75; color: var(--ash); margin: 0; }

.stat-row{ display: flex; gap: 8px; margin-top: 14px; }
.stat-chip{ flex: 1; background: var(--ink-soft); border-radius: 10px; padding: 10px 8px; text-align: center; }
.stat-chip .label{ display: block; color: var(--amber-soft); font-size: 10px; font-weight: 700; letter-spacing: .04em; margin-bottom: 4px; }
.stat-chip .value{ display: block; color: var(--bone); font-size: 12px; font-weight: 700; line-height: 1.35; }

.menu-photo{
  margin: 14px 0 0; aspect-ratio: 16 / 9; border-radius: var(--radius);
  background:
    linear-gradient(160deg, rgba(232,163,61,.25), transparent 60%),
    repeating-linear-gradient(135deg, #E7D6B8, #E7D6B8 14px, #F1E3CC 14px, #F1E3CC 28px);
  background-size: cover;
}
.menu-note{ font-size: 10.5px; color: var(--ash); padding: 10px 0 0; opacity: .85; }

.menu-list{ margin-top: 4px; }
.menu-card{
  display: flex; align-items: center; gap: 14px;
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px 14px; margin-top: 10px;
}
.menu-card.signature{ border-color: var(--amber); background: linear-gradient(180deg, #fff, var(--bone-dim)); }
.menu-badge{
  flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%;
  background: var(--ink-soft); color: var(--amber-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; text-align: center; line-height: 1.15;
}
.menu-card.signature .menu-badge{ background: var(--red); color: var(--bone); }
.menu-body{ flex: 1; min-width: 0; }
.menu-top{ display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.menu-name{ font-size: 14px; font-weight: 700; color: var(--ink); }
.menu-price{ font-size: 14px; font-weight: 700; color: var(--red); white-space: nowrap; }
.menu-desc{ font-size: 11.5px; color: var(--ash); margin-top: 3px; line-height: 1.6; }
.menu-price-note{ font-size: 9.5px; color: var(--ash); margin: 10px 2px 0; opacity: .8; }

.tag-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.tag-item{ display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 10px; }
.tag-item .icon{
  flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--bone-dim); display: flex; align-items: center; justify-content: center; color: var(--red);
}
.tag-item .icon svg{ width: 16px; height: 16px; }
.tag-item span.txt{ font-size: 11.5px; font-weight: 500; line-height: 1.4; color: var(--ink); }

.info-card{
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  margin-top: 14px; overflow: hidden;
}
.info-photo{
  aspect-ratio: 16 / 9;
  background:
    linear-gradient(160deg, rgba(180,39,30,.2), transparent 60%),
    repeating-linear-gradient(135deg, #4a3626, #4a3626 14px, #57402c 14px, #57402c 28px);
  background-size: cover;
}
.info-list{ padding: 4px 16px 4px; }
.info-row{ display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.info-row:last-child{ border-bottom: none; }
.info-row .k{ flex: 0 0 68px; color: var(--red); font-weight: 700; }
.info-row .v{ flex: 1; color: var(--ink); line-height: 1.6; }
.info-row .v a{ color: var(--red); font-weight: 700; }
.info-note{ font-size: 10px; color: var(--ash); padding: 8px 16px 12px; opacity: .8; line-height: 1.6; }

.footer-space{ height: 30px; }
.footer-credit{ font-size: 10px; color: var(--ash); text-align: center; padding: 0 16px 6px; line-height: 1.8; }
.site-logo{
  background: var(--bone);
  text-align: center;
  padding: 14px 20px 10px;
}
.site-logo img{ max-width: 200px; width: 100%; height: auto; }
.footer-logo{
  text-align: center;
  padding: 4px 20px 4px;
}
.footer-logo img{ max-width: 150px; width: 60%; height: auto; opacity: .85; }

.sticky-cta{
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 70;
  background: linear-gradient(180deg, rgba(33,21,18,0) 0%, rgba(33,21,18,.85) 30%, var(--ink) 60%);
  padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
}
.cta-btn{
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 56px;
  background: var(--maps-green); color: #fff; border: none; border-radius: 30px;
  font-size: 15px; font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 8px 20px rgba(20,107,69,.45);
  cursor: pointer; transition: transform .1s ease, background .15s ease;
}
.cta-btn:active{ transform: scale(.97); background: var(--maps-green-dark); }
.cta-btn svg{ width: 22px; height: 22px; flex: 0 0 auto; }
.cta-sub{ text-align: center; color: rgba(251,243,231,.65); font-size: 10.5px; margin: 7px 0 0; }

.not-found{ padding: 100px 30px; text-align:center; color: var(--ink); }
.not-found h1{ font-size: 18px; margin-bottom: 12px; }
.not-found p{ font-size: 13px; line-height: 1.8; color: var(--ash); }

a:focus-visible, button:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce){ * { transition: none !important; } }
</style>
</head>
<body>

<div class="app-shell" id="appShell">
  <!-- JSでここに描画します -->
</div>

<script src="data.js"></script>
<script src="ui-i18n.js"></script>
<script>
const TAG_ICONS = {
  card:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
  smoking: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="14" width="13" height="3.4" rx="0.6" fill="currentColor" stroke="none"/><rect x="15.5" y="14" width="3.6" height="3.4" rx="0.6" fill="none"/><path d="M19.5 12c1.2-1 1.2-2 0-3"/><path d="M21.5 9.5c1.4-1.2 1.4-2.6 0-4"/></svg>',
  clock:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 3.2"/></svg>',
  seats:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v11"/><path d="M5 10h11a2.5 2.5 0 0 1 2.5 2.5V15"/><path d="M5 14v7"/><path d="M18.5 15v6"/></svg>',
  room:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h9l6 6v11"/><path d="M14 4v6h6"/><circle cx="10" cy="14" r="1" fill="currentColor" stroke="none"/></svg>'
};

function esc(str){
  if(str === undefined || str === null) return "";
  return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

let currentLang = "ja";
let currentStore = null;

function getStoreIdFromUrl(){
  // クエリパラメータ（?id=◯◯）を優先。無ければパス（/◯◯）から取得（_redirectsによる個別URL対応）
  const q = new URLSearchParams(window.location.search).get("id");
  if (q) return q;
  const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
  if (path && STORES[path]) return path;
  return null;
}

function renderTestSwitcher(){
  // 個別URL（?id=◯◯ または /◯◯）でアクセスされた場合は、本番と同じ見た目にするため非表示にする
  const hasId = getStoreIdFromUrl();
  if(hasId) return "";

  const ids = Object.keys(STORES);
  const links = ids.map(sid => {
    const label = (STORES[sid].i18n.ja && STORES[sid].i18n.ja.heroTitle) || sid;
    const active = currentStore === STORES[sid] ? "background:#E8A33D;color:#211512;" : "";
    return `<button type="button" data-switch-id="${esc(sid)}" style="display:inline-block;padding:5px 10px;margin:2px;border-radius:6px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:11px;cursor:pointer;${active}">${esc(label)}</button>`;
  }).join("");
  return `
    <div style="background:#141414;padding:8px 10px;font-family:sans-serif;">
      <div style="color:#B9AE9A;font-size:10px;margin-bottom:4px;">【確認用】表示する店舗を選択（本番のQRコードには影響しません）</div>
      ${links}
    </div>`;
}

function bindTestSwitcher(){
  document.querySelectorAll("[data-switch-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      const sid = btn.getAttribute("data-switch-id");
      if(STORES[sid]) renderStore(STORES[sid]);
    });
  });
}


function renderMenuCards(menu){
  if(!menu || menu.length === 0) return "";
  return menu.map((m, i) => `
    <article class="menu-card ${i === 0 ? "signature" : ""}">
      <div class="menu-badge">${esc(m.badge || (i + 1))}</div>
      <div class="menu-body">
        <div class="menu-top">
          <span class="menu-name">${esc(m.name)}</span>
          <span class="menu-price">${esc(m.price)}</span>
        </div>
        ${m.desc ? `<p class="menu-desc">${esc(m.desc)}</p>` : ""}
      </div>
    </article>`).join("");
}

function renderTagGrid(store, lang){
  const t = store.i18n[lang];
  const tags = [
    { icon: "card", text: t.tag1 },
    { icon: "smoking", text: t.tag2 },
    { icon: "clock", text: t.tag3 },
    { icon: "room", text: t.tag5 }
  ].filter(tag => tag.text);
  return tags.map(tag => `
    <div class="tag-item">
      <span class="icon">${TAG_ICONS[tag.icon]}</span>
      <span class="txt">${esc(tag.text)}</span>
    </div>`).join("");
}

function renderStore(store){
  currentStore = store;
  const t = store.i18n[currentLang] || store.i18n.ja;
  const u = UI_I18N[currentLang] || UI_I18N.ja;
  const destination = encodeURIComponent(store.mapDestination || store.address || t.heroTitle || "");
  const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${destination}`;
  // 電話番号を国際形式に変換（先頭の0を+81に置き換え）。
  // これにより海外の携帯電話や、海外SIMを挿した端末からも問題なく発信できる。
  const telDigits = (store.tel || "").replace(/[^0-9]/g, "");
  const telHref = telDigits.startsWith("0") ? "+81" + telDigits.slice(1) : telDigits;

  document.title = `${t.heroTitle || "店舗情報"} | 店舗情報`;

  document.getElementById("appShell").innerHTML = `
    ${renderTestSwitcher()}
    <nav class="lang-bar" aria-label="Language">
      <button type="button" data-set-lang="ja">JP</button>
      <button type="button" data-set-lang="en">EN</button>
      <button type="button" data-set-lang="zh-Hant">繁體字</button>
      <button type="button" data-set-lang="ko">KO</button>
      <button type="button" data-set-lang="th">TH</button>
    </nav>

    <div class="site-logo">
      <img src="images/ssmap-logo.png" alt="すすきの SOUTHERN MAP" loading="lazy">
    </div>

    <header class="hero${store.heroImage ? "" : " no-photo"}"${store.heroImage ? ` style="background-image:url('${store.heroImage}');background-size:cover;background-position:center;"` : ""}>
      ${store.is24h ? `<span class="hero-badge-24">${esc(u.badge24)}</span>` : ""}
      <span class="hero-tag">${esc(t.heroTag)}</span>
      <div class="hero-content">
        ${t.heroEyebrow ? `<p class="hero-eyebrow">${esc(t.heroEyebrow)}</p>` : ""}
        ${t.heroKana ? `<p class="hero-kana">${esc(t.heroKana)}</p>` : ""}
        <h1 class="hero-title">${esc(t.heroTitle)}</h1>
        <p class="hero-sub">${esc(t.heroSub)}</p>
      </div>
    </header>

    <div class="coupon-wrap">
      <div class="coupon">
        <div class="coupon-stub">${esc(u.couponStub)}</div>
        <div class="coupon-main">
          <span class="coupon-main-text">${esc(t.couponMain)}</span>
          <span class="coupon-note">${esc(t.couponNote)}</span>
          <span class="coupon-expiry">${esc(t.couponExpiry)}</span>
        </div>
      </div>
    </div>

    <section class="section">
      <h2 class="section-heading"><small>${esc(u.sectionPoint)}</small></h2>
      <div class="stat-row">
        <div class="stat-chip"><span class="label">${esc(u.statBudgetLabel)}</span><span class="value">${esc(t.budgetValue)}</span></div>
        <div class="stat-chip"><span class="label">${esc(u.statAccessLabel)}</span><span class="value">${esc(t.areaValue)}</span></div>
      </div>
      <div class="tag-grid">${renderTagGrid(store, currentLang)}</div>
    </section>

    <div class="divider"></div>

    <section class="section">
      <h2 class="section-heading"><small>${esc(u.sectionMenu)}</small> <span>${esc(u.menuHeading)}</span></h2>
      ${store.menuImage ? `<div class="menu-photo" style="background-image:url('${store.menuImage}');background-size:cover;background-position:center;"></div>` : ""}
      ${t.menu && t.menu.length ? `
      <p class="menu-note">${esc(u.menuNote)}</p>
      <div class="menu-list">${renderMenuCards(t.menu)}</div>
      <p class="menu-price-note">${esc(u.menuPriceNote)}</p>` : `
      <p class="menu-note">${esc(u.menuComingSoon)}</p>`}
    </section>

    <div class="divider"></div>

    <section class="section">
      <h2 class="section-heading"><small>${esc(u.sectionInfo)}</small></h2>
      <div class="info-card">
        ${store.interiorImage ? `<div class="info-photo" style="background-image:url('${store.interiorImage}');background-size:cover;background-position:center;"></div>` : ""}
        <div class="info-list">
          ${(t.addressText || store.address) ? `<div class="info-row"><span class="k">${esc(u.labelAddress)}</span><span class="v">${esc(t.addressText || store.address)}${store.accessNote ? `<br>${esc(t.accessNote || "")}` : ""}</span></div>` : ""}
          ${t.hoursText ? `<div class="info-row"><span class="k">${esc(u.labelHours)}</span><span class="v">${esc(t.hoursText)}</span></div>` : ""}
          ${t.closedText ? `<div class="info-row"><span class="k">${esc(u.labelClosed)}</span><span class="v">${esc(t.closedText)}</span></div>` : ""}
          <div class="info-row"><span class="k">${esc(u.labelSeats)}</span><span class="v">${esc(t.tag4 || "")}</span></div>
          <div class="info-row"><span class="k">${esc(u.labelPhone)}</span><span class="v">${store.tel ? `<a href="tel:${esc(telHref)}">${esc(store.tel)}</a>` : "-"}</span></div>
          <div class="info-row"><span class="k">${esc(u.labelCard)}</span><span class="v">${esc(t.cardText)}</span></div>
          <div class="info-row"><span class="k">${esc(u.labelEmoney)}</span><span class="v">${esc(t.emoneyText)}</span></div>
          <div class="info-row"><span class="k">${esc(u.labelQr)}</span><span class="v">${esc(t.qrText)}</span></div>
          <div class="info-row"><span class="k">${esc(u.labelSmoke)}</span><span class="v">${esc(t.smokeText)}</span></div>
        </div>
        <p class="info-note">${esc(u.infoNote)}</p>
      </div>
    </section>

    ${(t.halalText || t.foodNote) ? `
    <section class="section">
      <h2 class="section-heading"><small>${esc(u.sectionFood)}</small></h2>
      <div class="info-card">
        <div class="info-list">
          ${t.halalText ? `<div class="info-row"><span class="k">${esc(u.labelHalal)}</span><span class="v">${esc(t.halalText)}</span></div>` : ""}
        </div>
        ${t.foodNote ? `<p class="info-note">${esc(t.foodNote)}</p>` : ""}
      </div>
    </section>` : ""}

    <section class="section">
      <p class="footer-credit">${esc(u.footerNote1)}<br>${esc(u.footerNote2)}</p>
      <div class="footer-logo">
        <img src="images/ssmap-logo.png" alt="すすきの SOUTHERN MAP" loading="lazy">
      </div>
      <div class="footer-space"></div>
    </section>

    <div class="sticky-cta">
      <button type="button" class="cta-btn" id="mapsBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z" fill="#fff"/><circle cx="12" cy="10" r="2.6" fill="#1E8E5A"/></svg>
        <span>${esc(u.ctaButton)}</span>
      </button>
      <p class="cta-sub">${esc(u.ctaSub)}</p>
    </div>
  `;

  document.getElementById("mapsBtn").addEventListener("click", () => {
    window.open(mapUrl, "_blank", "noopener");
  });

  document.querySelectorAll(".lang-bar button").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-set-lang") === currentLang);
    btn.addEventListener("click", () => {
      currentLang = btn.getAttribute("data-set-lang");
      try { localStorage.setItem("ssmap_lang", currentLang); } catch(e){}
      renderStore(currentStore);
    });
  });

  bindTestSwitcher();
}

function renderNotFound(){
  document.getElementById("appShell").innerHTML = `
    ${renderTestSwitcher()}
    <div class="not-found">
      <h1>店舗情報が見つかりません</h1>
      <p>この店舗ページは存在しないか、URLが正しくない可能性があります。<br>お手数ですが、フリーペーパー掲載のQRコードから再度アクセスしてください。</p>
    </div>
  `;
  bindTestSwitcher();
}

(function init(){
  try { currentLang = localStorage.getItem("ssmap_lang") || "ja"; } catch(e){}
  const id = getStoreIdFromUrl();
  // IDが無い場合は、確認用として最初の店舗を自動表示します
  // （実際の運用ではQRコードのURLに必ず ?id=◯◯ が入るため、この分岐は使われません）
  const firstId = Object.keys(STORES)[0];
  const store = id ? STORES[id] : STORES[firstId];
  if(store){
    renderStore(store);
  } else {
    renderNotFound();
  }
})();
</script>
</body>
</html>
